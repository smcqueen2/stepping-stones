name: Build and Deploy Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Opt-in cutover only: unset keeps today's scheduled Pages generation.
    if: github.event_name != 'schedule' || vars.DATA_REFRESH_PROVIDER != 'cloudflare' || vars.DATA_ENDPOINT == ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Restore last verified NRW warning response
        uses: actions/cache@v4
        with:
          path: .cache/nrw-warnings.json
          key: nrw-warnings-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: nrw-warnings-v1-

      - name: Generate live data
        env:
          NRW_API_KEY: ${{ secrets.NRW_API_KEY }}
        run: npm run generate:data

      - name: Build
        env:
          VITE_DATA_ENDPOINT: ${{ vars.DATA_ENDPOINT }}
          VITE_REPORTS_ENDPOINT: ${{ vars.REPORTS_ENDPOINT }}
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5
        # Transient GitHub Pages API errors shouldn't fail a 15-minutely job; deploy-pages fails loudly if truly misconfigured.
        continue-on-error: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
