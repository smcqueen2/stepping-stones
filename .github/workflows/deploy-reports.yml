name: Check and Deploy Community Reports

on:
  pull_request:
    branches: ['main']
    paths: ['workers/reports/**', 'src/lib/community-reports.ts', 'src/lib/report-contract.ts', 'tests/**', 'package*.json', '.github/workflows/deploy-reports.yml']
  push:
    branches: ['main']
    paths: ['workers/reports/**', 'src/lib/community-reports.ts', 'src/lib/report-contract.ts', 'tests/**', 'package*.json', '.github/workflows/deploy-reports.yml']
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy reports after validation (main only)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            workers/data-refresh/package-lock.json
      - run: npm ci
      - run: npm run worker:install
      - run: npm test -- --maxWorkers=2
      - run: npx --no-install tsc --noEmit
      - run: npm run reports:check
      - run: npm run reports:integration

  deploy:
    needs: validate
    if: >-
      github.ref == 'refs/heads/main'
      && ((github.event_name == 'push' && vars.CLOUDFLARE_REPORTS_DEPLOY_ENABLED == 'true')
          || (github.event_name == 'workflow_dispatch' && inputs.deploy))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: cloudflare-community-reports-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_REPORTS_DATABASE_ID: ${{ vars.CLOUDFLARE_REPORTS_DATABASE_ID }}
      TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
      TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: workers/data-refresh/package-lock.json
      - name: Check required credentials before provisioning
        shell: bash
        run: |
          for setting in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN TURNSTILE_SITE_KEY TURNSTILE_SECRET_KEY; do
            if [ -z "${!setting}" ]; then
              echo "::error::Configure $setting privately in the repository Actions settings. See docs/community-reports.md."
              exit 1
            fi
          done
      - run: npm run worker:install
      - name: Skip superseded main revisions
        id: revision
        shell: bash
        run: |
          current_head="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ -z "$current_head" ]; then
            echo '::error::Could not verify current main.'
            exit 1
          fi
          if [ "$current_head" = "$GITHUB_SHA" ]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Identify deployment token without exposing its value
        if: steps.revision.outputs.current == 'true'
        run: node workers/reports/scripts/check-deploy-token.mjs
      - name: Validate Turnstile secret without submitting a report
        if: steps.revision.outputs.current == 'true'
        run: node workers/reports/scripts/check-turnstile.mjs
      - name: Create or reuse observation storage
        if: steps.revision.outputs.current == 'true'
        run: node workers/reports/scripts/provision.mjs
      - name: Migrate and deploy the reports service
        if: steps.revision.outputs.current == 'true'
        run: node workers/reports/scripts/deploy.mjs
      - name: Check public summary without submitting an observation
        if: steps.revision.outputs.current == 'true'
        run: node workers/reports/scripts/check-hosted.mjs
