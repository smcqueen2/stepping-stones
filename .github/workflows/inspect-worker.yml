name: Inspect Data Worker

on:
  workflow_dispatch:
    inputs:
      watch:
        description: 'Watch runtime logs for three minutes (start shortly before a quarter-hour refresh)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  inspect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_KV_NAMESPACE_ID: ${{ vars.CLOUDFLARE_KV_NAMESPACE_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect deployed configuration and saved snapshot
        run: node workers/data-refresh/scripts/check-hosted-config.mjs
      - name: Install runtime-log client
        if: inputs.watch
        run: npm run worker:install
      - name: Prepare public configuration for runtime-log client
        if: inputs.watch
        run: node workers/data-refresh/scripts/prepare-ci-config.mjs
      - name: Observe runtime logs without redeploying
        if: inputs.watch
        working-directory: workers/data-refresh
        shell: bash
        run: |
          set +e
          timeout 180s npx --no-install wrangler tail --config wrangler.ci.json --format json --sampling-rate 1
          result=$?
          if [ "$result" -ne 0 ] && [ "$result" -ne 124 ]; then exit "$result"; fi
      - name: Inspect saved snapshot after observation
        if: inputs.watch
        run: node workers/data-refresh/scripts/check-hosted-config.mjs
